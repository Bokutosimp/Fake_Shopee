# LOCAL testing only. A CTF platform orchestrates the image itself and does not
# use this file. Injects a test flag and maps the internal port 80 to host 8080.
services:
  shopstack:
    build: .
    image: shopstack:local
    environment:
      GZCTF_FLAG: "flag{local_test}"
    ports:
      - "8080:80"
